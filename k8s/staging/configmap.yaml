apiVersion: v1
kind: ConfigMap
metadata:
  name: okuz-ai-staging-config
  namespace: okuz-ai-staging
  labels:
    app: okuz-ai
    environment: staging
data:
  # Application Settings
  NODE_ENV: "staging"
  PORT: "3002"
  API_VERSION: "v1"
  
  # Service Discovery
  PLANNING_SERVICE_URL: "http://planning-service:3001"
  SMART_TOOLS_SERVICE_URL: "http://smart-tools-service:3002"
  GAMIFICATION_SERVICE_URL: "http://gamification-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"
  AUTH_SERVICE_URL: "http://auth-service:3005"
  
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "https://staging.okuz.ai,https://staging-admin.okuz.ai"
  
  # Rate Limiting
  THROTTLER_SHORT_TTL: "60000"
  THROTTLER_SHORT_LIMIT: "5"
  THROTTLER_MEDIUM_TTL: "60000"
  THROTTLER_MEDIUM_LIMIT: "20"
  THROTTLER_LONG_TTL: "60000"
  THROTTLER_LONG_LIMIT: "100"
  
  # Circuit Breaker
  CIRCUIT_BREAKER_TIMEOUT: "5000"
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_RESET_TIMEOUT: "30000"
  
  # Load Balancer
  LOAD_BALANCER_STRATEGY: "round-robin"
  
  # Monitoring
  PROMETHEUS_PORT: "9090"
  SWAGGER_ENABLE: "true"
  HEALTH_CHECK_INTERVAL: "30000"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # External Services
  EMAIL_SERVICE_URL: "http://email-service:3006"
  PUSH_NOTIFICATION_SERVICE_URL: "http://push-service:3007"
  
  # Staging Specific
  DEBUG: "false"
  HOT_RELOAD: "false"
  MOCK_EXTERNAL_SERVICES: "false"
  ENABLE_TEST_DATA: "true"
