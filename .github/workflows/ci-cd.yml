name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  POSTGRES_VERSION: '14'
  REDIS_VERSION: '7'

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Generate Prisma Client
      working-directory: ./backend
      run: npx prisma generate
    
    - name: Run Database Migrations
      working-directory: ./backend
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    
    - name: Run Backend Unit Tests
      working-directory: ./backend
      run: npm run test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-secret
    
    - name: Run Backend Integration Tests
      working-directory: ./backend
      run: npm run test:e2e
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-secret
    
    - name: Run Backend Linting
      working-directory: ./backend
      run: npm run lint
    
    - name: Run Backend Type Check
      working-directory: ./backend
      run: npm run type-check

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/executive-dashboard/package-lock.json
    
    - name: Install Frontend Dependencies
      working-directory: ./frontend/executive-dashboard
      run: npm ci
    
    - name: Run Frontend Unit Tests
      working-directory: ./frontend/executive-dashboard
      run: npm run test -- --coverage --watchAll=false
    
    - name: Run Frontend Linting
      working-directory: ./frontend/executive-dashboard
      run: npm run lint
    
    - name: Run Frontend Type Check
      working-directory: ./frontend/executive-dashboard
      run: npm run type-check
    
    - name: Build Frontend
      working-directory: ./frontend/executive-dashboard
      run: npm run build

  # E2E Tests
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Dependencies
      run: |
        cd backend && npm ci
        cd ../frontend/executive-dashboard && npm ci
    
    - name: Setup Backend
      working-directory: ./backend
      run: |
        npx prisma generate
        npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    
    - name: Start Backend
      working-directory: ./backend
      run: npm run start:dev &
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-secret
        PORT: 3001
    
    - name: Start Frontend
      working-directory: ./frontend/executive-dashboard
      run: npm start &
    
    - name: Wait for Services
      run: |
        npx wait-on http://localhost:3001/health
        npx wait-on http://localhost:3000
    
    - name: Run E2E Tests
      working-directory: ./frontend/executive-dashboard
      run: npx cypress run
      env:
        CYPRESS_baseUrl: http://localhost:3000

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Security Audit
      run: |
        cd backend && npm audit --audit-level moderate
        cd ../frontend/executive-dashboard && npm audit --audit-level moderate
    
    - name: Run Snyk Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  # Build and Deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Build Backend
      working-directory: ./backend
      run: |
        npm ci
        npm run build
    
    - name: Build Frontend
      working-directory: ./frontend/executive-dashboard
      run: |
        npm ci
        npm run build
    
    - name: Build Docker Images
      run: |
        docker build -t okuz-ai-backend ./backend
        docker build -t okuz-ai-frontend ./frontend/executive-dashboard
    
    - name: Push to Container Registry
      if: github.event_name == 'push'
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker tag okuz-ai-backend ${{ secrets.DOCKER_USERNAME }}/okuz-ai-backend:latest
        docker tag okuz-ai-frontend ${{ secrets.DOCKER_USERNAME }}/okuz-ai-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/okuz-ai-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/okuz-ai-frontend:latest
    
    - name: Deploy to Production
      if: github.event_name == 'push'
      run: |
        # Add your deployment script here
        echo "Deploying to production..."

  # Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install Artillery
      run: npm install -g artillery
    
    - name: Run Performance Tests
      run: |
        artillery run backend/performance-tests/load-test.yml
        artillery run frontend/executive-dashboard/performance-tests/frontend-load-test.yml

  # Code Quality
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Run SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: Code Coverage Report
      run: |
        cd backend && npm run test:coverage
        cd ../frontend/executive-dashboard && npm run test:coverage