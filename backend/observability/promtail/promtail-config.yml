server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Application logs
  - job_name: okuz-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: okuz-api
          service: api
          environment: production
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            requestId: requestId
            userId: userId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          requestId:
          userId:
      - output:
          source: message

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          service: system
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+):\s+(?P<message>.*)'
      - timestamp:
          source: timestamp
          format: 'Jan 2 15:04:05'
      - labels:
          hostname:
          service:

  # Docker logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          service: docker
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            message: log
            container_id: id
            container_name: name
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          container_id:
          container_name:

  # Nginx logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+)\s+-\s+-\s+\[(?P<timestamp>[^\]]+)\]\s+"(?P<method>\S+)\s+(?P<path>\S+)\s+(?P<protocol>\S+)"\s+(?P<status>\d+)\s+(?P<body_bytes_sent>\d+)\s+"(?P<referer>[^"]*)"\s+"(?P<user_agent>[^"]*)"'
      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'
      - labels:
          remote_addr:
          method:
          path:
          status:
          user_agent:

  # Database logs
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          service: database
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3}\s+\w+)\s+(?P<level>\w+):\s+(?P<message>.*)'
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000 MST'
      - labels:
          level:

  # Redis logs
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          service: cache
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d+:\w+\s+\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+(?P<message>.*)'
      - timestamp:
          source: timestamp
          format: '2 Jan 15:04:05.000'
      - labels:
          level:

  # Error logs
  - job_name: errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: errors
          service: error-tracking
          __path__: /app/logs/error*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            error: error
            stack: stack
            requestId: requestId
            userId: userId
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          requestId:
          userId:
      - output:
          source: message

  # Access logs
  - job_name: access
    static_configs:
      - targets:
          - localhost
        labels:
          job: access
          service: api
          __path__: /app/logs/access*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            method: method
            url: url
            status: status
            responseTime: responseTime
            userAgent: userAgent
            ip: ip
            userId: userId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          method:
          status:
          userId:
      - output:
          source: message

  # Performance logs
  - job_name: performance
    static_configs:
      - targets:
          - localhost
        labels:
          job: performance
          service: monitoring
          __path__: /app/logs/performance*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            operation: operation
            duration: duration
            memory: memory
            cpu: cpu
            requestId: requestId
            userId: userId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          operation:
          requestId:
          userId:
      - output:
          source: message
