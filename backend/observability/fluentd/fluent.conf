<source>
  @type tail
  path /app/logs/*.log
  pos_file /var/log/fluentd/okuz-api.log.pos
  tag okuz-api
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%L%z
</source>

<source>
  @type tail
  path /var/log/nginx/*.log
  pos_file /var/log/fluentd/nginx.log.pos
  tag nginx
  format nginx
</source>

<source>
  @type tail
  path /var/log/postgresql/*.log
  pos_file /var/log/fluentd/postgresql.log.pos
  tag postgresql
  format /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+) (?<level>\w+): (?<message>.*)$/
  time_key timestamp
  time_format %Y-%m-%d %H:%M:%S.%3N %Z
</source>

<filter okuz-api>
  @type record_transformer
  <record>
    service okuz-api
    environment production
  </record>
</filter>

<filter nginx>
  @type record_transformer
  <record>
    service nginx
    environment production
  </record>
</filter>

<filter postgresql>
  @type record_transformer
  <record>
    service postgresql
    environment production
  </record>
</filter>

<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name okuz-logs
  type_name _doc
  include_timestamp true
  <buffer>
    @type file
    path /var/log/fluentd/buffers/elasticsearch
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
  </buffer>
</match>

<match **>
  @type stdout
</match>
