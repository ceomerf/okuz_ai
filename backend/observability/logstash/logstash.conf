input {
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    codec => "json"
    tags => ["okuz-api"]
  }
  
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  if "okuz-api" in [tags] {
    # Parse JSON logs
    if [message] {
      json {
        source => "message"
      }
    }
    
    # Add timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    # Add service information
    mutate {
      add_field => { "service" => "okuz-api" }
    }
    
    # Parse HTTP request information
    if [method] and [url] {
      mutate {
        add_field => { "http_method" => "%{method}" }
        add_field => { "http_url" => "%{url}" }
      }
    }
    
    # Parse error information
    if [level] == "error" {
      mutate {
        add_tag => ["error"]
      }
    }
    
    # Parse performance information
    if [duration] {
      mutate {
        add_field => { "response_time_ms" => "%{duration}" }
      }
    }
  }
  
  if "beats" in [tags] {
    # Process beats input
    mutate {
      add_field => { "source" => "beats" }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "okuz-logs-%{+YYYY.MM.dd}"
    template_name => "okuz-logs"
    template => "/etc/logstash/templates/okuz-logs.json"
    template_overwrite => true
  }
  
  # Send to stdout for debugging
  stdout {
    codec => rubydebug
  }
  
  # Send to file for backup
  file {
    path => "/var/log/logstash/okuz-logs.log"
  }
}
