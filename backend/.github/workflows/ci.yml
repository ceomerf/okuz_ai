name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
        working-directory: ./backend
      - name: Lint
        run: npm run lint --if-present
        working-directory: ./backend
      - name: Build
        run: npm run build --if-present
        working-directory: ./backend
      - name: Test
        run: npm test --if-present
        working-directory: ./backend

