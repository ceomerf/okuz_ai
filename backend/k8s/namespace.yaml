apiVersion: v1
kind: Namespace
metadata:
  name: okuz-ai
  labels:
    name: okuz-ai
    environment: production
    app: okuz-ai
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: okuz-ai-quota
  namespace: okuz-ai
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "50"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: okuz-ai-limits
  namespace: okuz-ai
spec:
  limits:
  - default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "8"
      memory: "16Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container
